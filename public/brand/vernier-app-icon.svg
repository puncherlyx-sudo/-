<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vernier">
  <defs>
    <linearGradient id="vn-accent" gradientUnits="userSpaceOnUse" x1="114" y1="386" x2="398" y2="146">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.52" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="vn-glow" cx="0.22" cy="0.1" r="0.92">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Icon Tile -->
  <rect width="512" height="512" rx="112" fill="#0B0F17"/>
  <rect width="512" height="512" rx="112" fill="url(#vn-glow)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Optically Centered Architectural Vernier V Mark -->
  <g>
    <!-- Left Arm Inner Ticks: Main Scale (4 intervals -> ticks at 0.25, 0.50, 0.75) -->
    <rect x="170" y="189" width="32" height="7.5" rx="3.75" fill="#94A3B8"/>
    <rect x="197" y="236" width="29" height="7.5" rx="3.75" fill="#94A3B8"/>
    <rect x="224" y="283" width="21" height="7.5" rx="3.75" fill="#94A3B8"/>

    <!-- Right Arm Inner Ticks: Vernier Scale (5 intervals, step 0.8 -> ticks at 0.20, 0.40, 0.60, 0.80) -->
    <rect x="314" y="179.6" width="34" height="7.5" rx="3.75" fill="#94A3B8"/>
    <rect x="293" y="217.2" width="33" height="7.5" rx="3.75" fill="#94A3B8"/>
    <rect x="275" y="254.8" width="29" height="7.5" rx="3.75" fill="#94A3B8"/>
    <rect x="263" y="292.4" width="19" height="7.5" rx="3.75" fill="#94A3B8"/>

    <!-- Coincident Top Caliper Jaws (aligned at t = 1.0) -->
    <rect x="138" y="146" width="48" height="12" rx="4" fill="url(#vn-accent)"/>
    <rect x="326" y="146" width="48" height="12" rx="4" fill="url(#vn-accent)"/>

    <!-- Primary Architectural V Caliper Silhouette (drawn over tick roots so beams remain crisp & unbroken) -->
    <path
      d="M 116 146 L 146 146 L 256 334 L 366 146 L 396 146 L 260 382 Q 256 388 252 382 Z"
      fill="#E2E8F0"
    />

    <!-- Coincident Zero-Point Vertex Prism (aligned at t = 0.0, cleanly integrated into apex) -->
    <path
      d="M 237 356 L 256 334 L 275 356 L 260 382 Q 256 388 252 382 Z"
      fill="url(#vn-accent)"
    />
  </g>
</svg>
